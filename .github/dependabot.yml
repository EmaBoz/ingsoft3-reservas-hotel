version: 2
updates:
  - package-ecosystem: "gomod"            # las dependencias de los 4 microservicios Go
    directories:
      - "/services/users-api"
      - "/services/rooms-api"
      - "/services/reservations-api"
      - "/services/search-api"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"              # las del frontend
    directory: "/frontend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"   # las actions del pipeline también son dependencias
    directory: "/"
    schedule:
      interval: "weekly"
