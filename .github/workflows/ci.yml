name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-users-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen de users-api
        uses: docker/build-push-action@v7
        with:
          context: ./services/users-api
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/emaboz/ingsoft3-reservas-hotel-users-api:sha-${{ github.sha }}
          cache-from: type=gha,scope=users-api
          cache-to: type=gha,mode=max,scope=users-api

  build-rooms-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen de rooms-api
        uses: docker/build-push-action@v7
        with:
          context: ./services/rooms-api
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/emaboz/ingsoft3-reservas-hotel-rooms-api:sha-${{ github.sha }}
          cache-from: type=gha,scope=rooms-api
          cache-to: type=gha,mode=max,scope=rooms-api

  build-reservations-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests de reservations-api
        uses: docker/build-push-action@v7
        with:
          context: ./services/reservations-api
          target: test
          load: true
          push: false
          tags: reservations-api-test:ci
          cache-from: type=gha,scope=reservations-api-test
          cache-to: type=gha,mode=max,scope=reservations-api-test

      - name: Correr los tests con coverage
        run: |
          docker run --rm -v "${{ github.workspace }}/reservations-coverage:/out" reservations-api-test:ci

      - name: Resumen del coverage de reservations-api
        if: ${{ !cancelled() }}
        run: |
          F=reservations-coverage/coverage.txt
          test -f "$F"
          {
            echo "### Coverage de reservations-api"
            echo "| métrica | % |"
            echo "|---|---|"
            echo "| sentencias | $(tail -n 1 $F | awk '{print $NF}') |"
            echo "| ramas | Go no la mide (ver decisiones.md) |"
            echo ""
            echo '```'
            cat "$F"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: Publicar el coverage de reservations-api
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: coverage-reservations-api
          path: reservations-coverage

      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen de reservations-api
        uses: docker/build-push-action@v7
        with:
          context: ./services/reservations-api
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/emaboz/ingsoft3-reservas-hotel-reservations-api:sha-${{ github.sha }}
          cache-from: type=gha,scope=reservations-api
          cache-to: type=gha,mode=max,scope=reservations-api

  build-search-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen de search-api
        uses: docker/build-push-action@v7
        with:
          context: ./services/search-api
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/emaboz/ingsoft3-reservas-hotel-search-api:sha-${{ github.sha }}
          cache-from: type=gha,scope=search-api
          cache-to: type=gha,mode=max,scope=search-api

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: test
          load: true
          push: false
          tags: frontend-test:ci
          cache-from: type=gha,scope=frontend-test
          cache-to: type=gha,mode=max,scope=frontend-test

      - name: Correr los tests del frontend con coverage
        run: |
          docker run --rm -e COVERAGE_DIR=/salida/reporte \
            -v "${{ github.workspace }}/frontend-coverage:/salida" frontend-test:ci

      - name: Resumen del coverage del frontend
        if: ${{ !cancelled() }}
        run: |
          F=frontend-coverage/reporte/coverage-summary.json
          test -f "$F"
          node -e "
            const t = require('./$F').total;
            if (!t.lines.total) { console.error('midio 0 archivos: revisa el include'); process.exit(1); }
            const f = (m) => \`| \${m} | \${t[m].pct}% |\`;
            console.log('### Coverage del frontend');
            console.log('| métrica | % |'); console.log('|---|---|');
            console.log(f('lines')); console.log(f('branches')); console.log(f('functions'));
          " >> $GITHUB_STEP_SUMMARY

      - name: Publicar el coverage del frontend
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: coverage-frontend
          path: frontend-coverage

      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/emaboz/ingsoft3-reservas-hotel-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy-qa:
    runs-on: self-hosted                        # fallback local: mi notebook
    needs: [build-users-api, build-rooms-api, build-reservations-api, build-search-api, build-frontend]
    if: github.ref == 'refs/heads/main'         # los PR verifican; sólo main despliega
    environment: qa
    env:
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}   # secrets del environment qa
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    steps:
      - name: Bajar el commit verificado
        uses: actions/checkout@v6

      - name: Levantar QA local
        shell: bash
        run: docker compose -f compose.qa.yml up -d --build

      - name: Smoke test (espera a que QA conteste)
        shell: bash
        env:
          URL_ROOMS: http://localhost:8182
          URL_FRONT: http://localhost:3100
        run: |
          echo "Esperando a que QA esté vivo..."
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "$URL_ROOMS/health" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/api/v1/rooms" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/api/reservations" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/users" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null; then
              echo "✅ QA responde (apis + bases + front)"; exit 0
            fi
            sleep 20
          done
          echo "❌ QA no respondió a tiempo"; exit 1
