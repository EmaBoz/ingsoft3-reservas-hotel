name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-users-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen de users-api
        uses: docker/build-push-action@v7
        with:
          context: ./services/users-api
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/emaboz/ingsoft3-reservas-hotel-users-api:sha-${{ github.sha }}
          cache-from: type=gha,scope=users-api
          cache-to: type=gha,mode=max,scope=users-api

  build-rooms-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen de rooms-api
        uses: docker/build-push-action@v7
        with:
          context: ./services/rooms-api
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/emaboz/ingsoft3-reservas-hotel-rooms-api:sha-${{ github.sha }}
          cache-from: type=gha,scope=rooms-api
          cache-to: type=gha,mode=max,scope=rooms-api

  build-reservations-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests de reservations-api
        uses: docker/build-push-action@v7
        with:
          context: ./services/reservations-api
          target: test
          load: true
          push: false
          tags: reservations-api-test:ci
          cache-from: type=gha,scope=reservations-api-test
          cache-to: type=gha,mode=max,scope=reservations-api-test

      - name: Correr los tests con coverage
        run: |
          docker run --rm -v "${{ github.workspace }}/reservations-coverage:/out" reservations-api-test:ci

      - name: Resumen del coverage de reservations-api
        if: ${{ !cancelled() }}
        run: |
          F=reservations-coverage/coverage.txt
          test -f "$F"
          {
            echo "### Coverage de reservations-api"
            echo "| métrica | % |"
            echo "|---|---|"
            echo "| sentencias | $(tail -n 1 $F | awk '{print $NF}') |"
            echo "| ramas | Go no la mide (ver decisiones.md) |"
            echo ""
            echo '```'
            cat "$F"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: Publicar el coverage de reservations-api
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-reservations-api
          path: reservations-coverage

      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen de reservations-api
        uses: docker/build-push-action@v7
        with:
          context: ./services/reservations-api
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/emaboz/ingsoft3-reservas-hotel-reservations-api:sha-${{ github.sha }}
          cache-from: type=gha,scope=reservations-api
          cache-to: type=gha,mode=max,scope=reservations-api

  build-search-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen de search-api
        uses: docker/build-push-action@v7
        with:
          context: ./services/search-api
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/emaboz/ingsoft3-reservas-hotel-search-api:sha-${{ github.sha }}
          cache-from: type=gha,scope=search-api
          cache-to: type=gha,mode=max,scope=search-api

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: test
          load: true
          push: false
          tags: frontend-test:ci
          cache-from: type=gha,scope=frontend-test
          cache-to: type=gha,mode=max,scope=frontend-test

      - name: Correr los tests del frontend con coverage
        run: |
          docker run --rm -e COVERAGE_DIR=/salida/reporte \
            -v "${{ github.workspace }}/frontend-coverage:/salida" frontend-test:ci

      - name: Resumen del coverage del frontend
        if: ${{ !cancelled() }}
        run: |
          F=frontend-coverage/reporte/coverage-summary.json
          test -f "$F"
          node -e "
            const t = require('./$F').total;
            if (!t.lines.total) { console.error('midio 0 archivos: revisa el include'); process.exit(1); }
            const f = (m) => \`| \${m} | \${t[m].pct}% |\`;
            console.log('### Coverage del frontend');
            console.log('| métrica | % |'); console.log('|---|---|');
            console.log(f('lines')); console.log(f('branches')); console.log(f('functions'));
          " >> $GITHUB_STEP_SUMMARY

      - name: Publicar el coverage del frontend
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-frontend
          path: frontend-coverage

      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/emaboz/ingsoft3-reservas-hotel-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy-qa:
    runs-on: self-hosted                        # fallback local: mi notebook
    needs: [build-users-api, build-rooms-api, build-reservations-api, build-search-api, build-frontend]
    if: github.ref == 'refs/heads/main'         # los PR verifican; sólo main despliega
    environment: qa
    env:
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}   # secrets del environment qa
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    steps:
      - name: Bajar el commit verificado
        uses: actions/checkout@v6

      - name: Desplegar en QA la imagen del commit
        shell: bash
        env:
          IMAGE_TAG: sha-${{ github.sha }}         # la imagen que publicó ESTA corrida
        run: |
          echo "Imagen a desplegar: $IMAGE_TAG"
          docker compose -f compose.qa.yml pull
          docker compose -f compose.qa.yml up -d

      - name: Smoke test (espera a que QA conteste)
        shell: bash
        env:
          URL_ROOMS: http://localhost:8182
          URL_FRONT: http://localhost:3100
        run: |
          echo "Esperando a que QA esté vivo..."
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "$URL_ROOMS/health" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/api/v1/rooms" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/api/reservations" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/users" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null; then
              echo "✅ QA responde (apis + bases + front)"; exit 0
            fi
            sleep 20
          done
          echo "❌ QA no respondió a tiempo"; exit 1

  integracion:
    runs-on: self-hosted
    needs: deploy-qa                            # QA ya ejecuta la imagen de ESTA corrida
    timeout-minutes: 15
    steps:
      - name: Bajar el código
        uses: actions/checkout@v6

      - name: Preparar Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Instalar dependencias (sin navegador)
        shell: bash
        working-directory: ./frontend
        run: npm ci

      - name: Integración contra la api de reservas de QA
        shell: bash
        working-directory: ./frontend
        env:
          API_BASE_URL: http://localhost:8183      # reservations-api de QA (la api, no el front)
        run: npx playwright test e2e/api.spec.js

      - name: Publicar reporte de integración
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-integracion
          path: frontend/playwright-report
          retention-days: 7

  e2e:
    runs-on: self-hosted
    needs: integracion                          # si la api está rota, no gastamos un navegador
    timeout-minutes: 20
    steps:
      - name: Bajar el código
        uses: actions/checkout@v6

      - name: Preparar Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Instalar dependencias y el navegador
        shell: bash
        working-directory: ./frontend
        run: |
          npm ci
          npx playwright install chromium

      - name: Usuario de prueba en QA (si ya existe, queda igual)
        shell: bash
        env:
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: |
          curl -s -o /dev/null -X POST http://localhost:8181/users -H 'Content-Type: application/json' \
            -d "{\"username\":\"e2e-admin\",\"email\":\"e2e-admin@hotel.test\",\"password\":\"$E2E_PASSWORD\",\"first_name\":\"E2E\",\"last_name\":\"Admin\"}"
          docker exec qa-mysql-users-1 sh -c 'mysql -uroot -p"$MYSQL_ROOT_PASSWORD" usersdb -e "UPDATE users SET role=\"admin\" WHERE username=\"e2e-admin\""'

      - name: e2e contra QA
        shell: bash
        working-directory: ./frontend
        env:
          E2E_BASE_URL: http://localhost:3100      # el front de QA
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: npx playwright test e2e/reservas.spec.js

      - name: Publicar reporte e2e
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-e2e
          path: frontend/playwright-report
          retention-days: 7

  deploy-prod:
    runs-on: self-hosted
    needs: e2e                                  # el gate: sin e2e verde ni se pide aprobación
    environment: production                     # acá la corrida se pausa hasta que alguien apruebe
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    env:
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}   # secrets del environment production
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      SENTRY_DSN: ${{ vars.SENTRY_DSN }}        # variable (no secret) del environment production
    steps:
      - name: Bajar el commit aprobado
        uses: actions/checkout@v6

      - name: Desplegar en PROD la MISMA imagen que verificó QA
        shell: bash
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          echo "Imagen a desplegar: $IMAGE_TAG"
          docker compose -f compose.prod.yml pull
          docker compose -f compose.prod.yml up -d

      - name: Smoke test PROD
        shell: bash
        env:
          URL_ROOMS: http://localhost:8282
          URL_FRONT: http://localhost:3200
        run: |
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "$URL_ROOMS/health" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/api/v1/rooms" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/api/reservations" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/users" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null; then
              echo "✅ PROD responde (apis + bases + front)"; exit 0
            fi
            sleep 20
          done
          echo "❌ PROD no respondió a tiempo"; exit 1
