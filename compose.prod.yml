# Entorno PROD (fallback local del TP6): lo levanta el job deploy-prod en el
# self-hosted runner. Es el docker-compose.yml del TP2 con estos cambios:
#  - (TP7) los 5 servicios propios usan la imagen del registry con la
#    etiqueta sha-<commit> que les pasa el pipeline (IMAGE_TAG), no build:
#  - name: prod, para que sea un proyecto aparte del de QA
#  - sin container_name (si no, QA y PROD chocan)
#  - volúmenes propios del entorno (_prod)
#  - sólo se publican al host el front y las 4 apis (PROD: 3200 y 8281-8284)
#  - las contraseñas y el JWT vienen de los secrets del environment production
name: prod

services:
  mysql-users:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD}
      MYSQL_DATABASE: usersdb
      MYSQL_USER: user
      MYSQL_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD}
    volumes:
      - mysql_users_data_prod:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_PASSWORD}" ]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  mysql-rooms:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD}
      MYSQL_DATABASE: roomsdb
      MYSQL_USER: roomsuser
      MYSQL_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD}
    volumes:
      - mysql_rooms_data_prod:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_PASSWORD}" ]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  mongodb:
    image: mongo:7.0
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD}
    volumes:
      - mongo_data_prod:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      timeout: 3s
      retries: 15

  rabbitmq:
    image: rabbitmq:3-management
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: reservas
      RABBITMQ_DEFAULT_PASS: ${DB_PASSWORD:?falta DB_PASSWORD}
    volumes:
      - rabbitmq_data_prod:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s

  solr:
    image: solr:9.5
    restart: always
    volumes:
      - solr_data_prod:/var/solr
    environment:
      - SOLR_HEAP=512m
    command:
      - solr-precreate
      - rooms-core
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8983/solr/rooms-core/admin/ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  memcached:
    image: memcached:1.6-alpine
    restart: always
    command: memcached -m 64

  users-api:
    image: ghcr.io/emaboz/ingsoft3-reservas-hotel-users-api:${IMAGE_TAG:?falta IMAGE_TAG}
    environment:
      - DB_HOST=mysql-users
      - DB_PORT=3306
      - DB_USER=user
      - DB_PASSWORD=${DB_PASSWORD:?falta DB_PASSWORD}
      - DB_NAME=usersdb
      - JWT_SECRET=${JWT_SECRET:?falta JWT_SECRET}
      - MEMCACHED_HOST=memcached
      - MEMCACHED_PORT=11211
      - MEMCACHED_TTL=600
    depends_on:
      mysql-users:
        condition: service_healthy
      memcached:
        condition: service_started
    ports:
      - "8281:8080"
    restart: unless-stopped

  rooms-api:
    image: ghcr.io/emaboz/ingsoft3-reservas-hotel-rooms-api:${IMAGE_TAG:?falta IMAGE_TAG}
    restart: always
    depends_on:
      mysql-rooms:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      search-api:
        condition: service_healthy
    environment:
      - DB_HOST=mysql-rooms
      - DB_PORT=3306
      - DB_USER=roomsuser
      - DB_PASSWORD=${DB_PASSWORD:?falta DB_PASSWORD}
      - DB_NAME=roomsdb
      - JWT_SECRET=${JWT_SECRET:?falta JWT_SECRET}
      - RABBITMQ_URL=amqp://reservas:${DB_PASSWORD}@rabbitmq:5672/
      - MEMCACHED_HOST=memcached
      - MEMCACHED_PORT=11211
      - MEMCACHED_TTL=300
      - SEARCH_API_BASE_URL=http://search-api:8083
    ports:
      - "8282:8080"

  reservations-api:
    image: ghcr.io/emaboz/ingsoft3-reservas-hotel-reservations-api:${IMAGE_TAG:?falta IMAGE_TAG}
    restart: always
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      MONGO_URI: "mongodb://root:${DB_PASSWORD:?falta DB_PASSWORD}@mongodb:27017/?authSource=admin"
      MONGO_DB_NAME: "mongodb"
      RABBITMQ_URL: "amqp://reservas:${DB_PASSWORD}@rabbitmq:5672/"
    ports:
      - "8283:8080"

  search-api:
    image: ghcr.io/emaboz/ingsoft3-reservas-hotel-search-api:${IMAGE_TAG:?falta IMAGE_TAG}
    restart: always
    depends_on:
      solr:
        condition: service_healthy
      memcached:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    environment:
      - SOLR_URL=http://solr:8983/solr
      - SOLR_CORE=rooms-core
      - MEMCACHED_HOST=memcached
      - MEMCACHED_PORT=11211
      - LOCAL_CACHE_TTL_SECONDS=60
      - DISTRIBUTED_CACHE_TTL_SECONDS=300
      - RABBITMQ_URL=amqp://reservas:${DB_PASSWORD}@rabbitmq:5672/
      - ROOMS_API_BASE_URL=http://rooms-api:8080
      - JWT_SECRET=${JWT_SECRET:?falta JWT_SECRET}
      - PORT=8083
      - GIN_MODE=release
    ports:
      - "8284:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    image: ghcr.io/emaboz/ingsoft3-reservas-hotel-frontend:${IMAGE_TAG:?falta IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      - users-api
      - rooms-api
      - reservations-api
      - search-api
    # La dirección de cada api se lee al arrancar (default.conf.template).
    # Acá coinciden con los defaults porque cada entorno tiene su propia red.
    environment:
      - USERS_API_URL=http://users-api:8080
      - ROOMS_API_URL=http://rooms-api:8080
      - RESERVATIONS_API_URL=http://reservations-api:8080
      - SEARCH_API_URL=http://search-api:8083
      - DNS_RESOLVER=127.0.0.11
    ports:
      - "3200:80"

volumes:
  mysql_users_data_prod:
  mysql_rooms_data_prod:
  mongo_data_prod:
  rabbitmq_data_prod:
  solr_data_prod:
