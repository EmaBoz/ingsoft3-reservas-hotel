server {
    listen 80;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # SPA: estáticos, con fallback a index.html para las rutas del router
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # La app es una arquitectura de microservicios: no hay un único backend,
    # así que cada prefijo de ruta se reenvía al microservicio que lo atiende
    # (mismo mapeo que usa el proxy de Vite en desarrollo, vite.config.ts).
    # Los nombres van en variables (no en el proxy_pass directo) para que
    # nginx los resuelva recién al llegar un pedido, no al arrancar — así el
    # contenedor del frontend no depende de que los backends ya existan.

    set $users_api http://users-api:8080;
    location /login {
        proxy_pass $users_api;
    }
    location /users {
        proxy_pass $users_api;
    }

    set $rooms_api http://rooms-api:8080;
    location /api/v1/ {
        proxy_pass $rooms_api;
    }

    set $reservations_api http://reservations-api:8080;
    location /api/reservations {
        proxy_pass $reservations_api;
    }

    # Ojo: el frontend llama a /search-api/api/search/rooms (con el prefijo
    # "/search-api" incluido en la ruta, ver src/services/SearchServices.ts) y
    # search-api expone la ruta real en /api/search/rooms, sin ese prefijo. En
    # desarrollo, el proxy de Vite reenvía la ruta completa sin recortarla
    # (mismo comportamiento) — es una inconsistencia preexistente en la app,
    # no introducida por esta dockerización. Documentado en decisiones.md.
    set $search_api http://search-api:8083;
    location /search-api/ {
        proxy_pass $search_api;
    }
}
